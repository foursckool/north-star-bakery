<form id="contact-form" action="#" method="post">
    <!-- FIRST FIELDSET: We updated this one with spans and removed 'required' -->
    <fieldset>
        <legend>Your Information</legend>
        
        <p>
            <label for="name">Full Name (required):</label>
            <input type="text" id="name" name="name">
            <span id="name-error" style="color: red; display: none; font-size: 0.9em;"></span>
        </p>
        
        <p>
            <label for="email">Email Address (required):</label>
            <input type="email" id="email" name="email">
            <span id="email-error" style="color: red; display: none; font-size: 0.9em;"></span>
        </p>

        <p>
            <label for="pickup-date">Requested Pickup Date:</label>
            <input type="date" id="pickup-date" name="pickup-date">
        </p>
    </fieldset>

    <!-- SECOND FIELDSET: Keep this exactly the same! -->
    <fieldset>
        <legend>Order Details</legend>

        <p>
            <label for="request-type">Request Type:</label>
            <select id="request-type" name="request-type" required>
                <option value="" disabled selected>Select an option</option>
                <option value="pre-order">Pre-order</option>
                <option value="general">General Question</option>
            </select>
        </p>

        <p>
            <label for="item-details">Item Details (What would you like to order?):</label><br>
            <textarea id="item-details" name="item-details" rows="4" required></textarea>
        </p>

        <p>
            <label for="allergies">Allergy Notes (if applicable):</label><br>
            <textarea id="allergies" name="allergies" rows="2"></textarea>
        </p>
    </fieldset>

    <button type="submit">Submit Request</button>
</form>
